name: Pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas del servidor
        run: node --test server/server.test.js
      - name: Instalar navegador de pruebas
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Pruebas de la app en el navegador
        run: python tests/e2e.py
      - name: Pruebas del servidor de Cloudflare (en local, con wrangler)
        run: |
          cd server/cloudflare
          npx --yes wrangler@3.99.0 dev --port 8788 --ip 127.0.0.1 --var CREATE_PASSWORD:clave-e2e --var 'ALLOWED_ORIGIN:*' > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8788/api/health && break; sleep 2; done
          cd ../..
          SERVIDOR=http://127.0.0.1:8788 CREATE_PASSWORD=clave-e2e node server/api.test.mjs
          SERVIDOR_SYNC=http://127.0.0.1:8788 python tests/e2e.py
        env:
          WRANGLER_SEND_METRICS: 'false'

  desplegar:
    # Solo se publica si todas las pruebas pasan
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar los archivos de la web
        run: |
          mkdir _site
          cp -r index.html manifest.json service-worker.js css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
