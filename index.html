<!DOCTYPE html>
<html lang="es" data-tema="ambar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de Vinilos</title>
<meta name="description" content="Tu colección de vinilos en estanterías: fichas, portadas, estadísticas y sincronización entre dispositivos. Funciona sin conexión.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#13100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinilos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  /* El tema se aplica antes de pintar para que no parpadee. */
  try { var t = localStorage.getItem('vinilos_tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="barra">
  <div class="marca">
    <svg class="marca-logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="#0c0c0c"/>
      <circle cx="24" cy="24" r="18" fill="none" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="none" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="24" cy="24" r="8" fill="var(--accent)"/>
      <circle cx="24" cy="24" r="1.8" fill="#0c0c0c"/>
      <path d="M10 14a17 17 0 0 1 9-6" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
    <h1 class="serif">Vinilos</h1>
    <span class="contador" id="contador" hidden></span>
  </div>
  <div class="barra-busqueda buscador">
    <i data-i="buscar"></i>
    <input class="campo" id="buscarEscritorio" type="search" placeholder="Buscar por título, artista, género o etiqueta" aria-label="Buscar" autocomplete="off">
    <button class="icon-btn limpiar" data-limpiar hidden aria-label="Borrar búsqueda"><i data-i="cerrar" class="ico-sm"></i></button>
  </div>
  <button class="icon-btn" id="btnSync" aria-label="Sincronización entre dispositivos" title="Sincronización"><i data-i="nube"></i><span class="estado-sync" hidden></span></button>
  <button class="btn btn-primario btn-anadir" data-accion="anadir"><i data-i="mas"></i>Añadir disco</button>
  <button class="icon-btn" id="btnMenu" aria-label="Más opciones" title="Más opciones"><i data-i="menu"></i></button>
</header>

<div class="zona-busqueda"><div class="buscador">
  <i data-i="buscar"></i>
  <input class="campo" id="buscarMovil" type="search" placeholder="Buscar en tu colección" aria-label="Buscar" autocomplete="off">
  <button class="icon-btn limpiar" data-limpiar hidden aria-label="Borrar búsqueda"><i data-i="cerrar" class="ico-sm"></i></button>
</div></div>

<div class="filtros">
  <div class="chips" role="group" aria-label="Mostrar">
    <button class="chip" data-estado="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-estado="tengo" aria-pressed="false">Los tengo</button>
    <button class="chip" data-estado="quiero" aria-pressed="false">Los quiero</button>
  </div>
  <select class="campo filtro-genero" id="filtroGenero" aria-label="Género"><option value="">Todos los géneros</option></select>
  <div class="chips vistas-escritorio" role="tablist" aria-label="Vista">
    <button class="chip" role="tab" data-vista="estanterias" aria-selected="true"><i data-i="estanterias" class="ico-sm"></i>Estanterías</button>
    <button class="chip" role="tab" data-vista="tabla" aria-selected="false"><i data-i="tabla" class="ico-sm"></i>Tabla</button>
    <button class="chip" role="tab" data-vista="estadisticas" aria-selected="false"><i data-i="grafica" class="ico-sm"></i>Estadísticas</button>
  </div>
</div>

<div id="avisos"></div>

<main id="principal">
  <section id="vistaEstanterias" aria-label="Estanterías"></section>
  <section id="vistaTabla" aria-label="Tabla" hidden></section>
  <section id="vistaEstadisticas" aria-label="Estadísticas" hidden></section>
  <footer class="pie" id="pie"></footer>
</main>

<nav class="nav-inferior" role="tablist" aria-label="Vista">
  <button role="tab" data-vista="estanterias" aria-selected="true"><i data-i="estanterias"></i>Estanterías</button>
  <button role="tab" data-vista="tabla" aria-selected="false"><i data-i="tabla"></i>Tabla</button>
  <button role="tab" data-vista="estadisticas" aria-selected="false"><i data-i="grafica"></i>Estadísticas</button>
</nav>
<button class="fab" data-accion="anadir"><i data-i="mas"></i>Añadir</button>

<input type="file" id="archivoImportar" accept=".json,application/json" hidden>
<input type="file" id="archivoPortada" accept="image/*" hidden>
<input type="file" id="archivoAudio" accept="audio/*" hidden>

<noscript><p style="padding:24px">Esta app necesita JavaScript activado.</p></noscript>
</body>
</html>
